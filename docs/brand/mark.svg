<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Bench">
  <title>Bench</title>
  <!-- The bench itself: what the rest stands on, and wider than them, so it
       reads as furniture rather than as an axis. -->
  <rect x="2.4" y="16.4" width="19.2" height="2.6" rx="1.3" fill="#8ba396"/>
  <!-- Three at rest. -->
  <rect x="4.6" y="11.4" width="2.4" height="5" rx="1.2" fill="#8ba396"/>
  <rect x="12.6" y="11.4" width="2.4" height="5" rx="1.2" fill="#8ba396"/>
  <rect x="16.6" y="11.4" width="2.4" height="5" rx="1.2" fill="#8ba396"/>
  <!-- One standing, and the only one with a head. The mark is the roster:
       several specialists waiting, and one of them wants you. The head is
       what stops it reading as a bar chart at 16px. -->
  <rect x="8.6" y="7.4" width="2.4" height="9" rx="1.2" fill="#4fd18b"/>
  <circle cx="9.8" cy="4.5" r="1.75" fill="#4fd18b"/>
</svg>
