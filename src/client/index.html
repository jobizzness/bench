<div id="stale" hidden role="alert">
  <strong>This link is out of date.</strong>
  <span>Bench was restarted with a different token. Open the URL it printed, or reload after restarting it.</span>
</div>

<main id="app">
  <aside id="roster">
    <header>
      <h1>Bench</h1>
      <button id="new-session" type="button">New</button>
    </header>
    <ul id="roster-list"></ul>
  </aside>

  <section id="stage">
    <header id="stage-head" hidden>
      <span id="stage-label"></span>
      <span id="stage-status"></span>
    </header>

    <div id="thread">
      <p id="empty">Select a specialist.</p>
    </div>

    <div id="working" hidden>
      <span id="working-glyph" aria-hidden="true"></span>
      <span id="working-verb"></span>
      <span id="working-meta"></span>
    </div>

    <div id="progress" hidden>
      <ol id="plan"></ol>
      <ul id="trail"></ul>
    </div>

    <footer id="composer">
      <div id="decision" hidden>
        <div id="decision-head">
          <span id="decision-kind" class="eyebrow" hidden></span>
          <strong id="decision-title"></strong>
          <span id="decision-summary"></span>
        </div>

        <div id="intake" hidden>
          <p id="intake-brief" hidden></p>
          <div id="intake-questions"></div>
          <details id="intake-assumed" hidden>
            <summary>
              <span id="intake-assumed-count"></span>
              <span id="intake-assumed-preview"></span>
            </summary>
            <div id="intake-assumed-questions"></div>
          </details>
        </div>

        <div id="decision-options"></div>
      </div>
      <form id="composer-form">
        <input id="composer-text" type="text" autocomplete="off"
               placeholder="Message this specialist" disabled />
        <button id="composer-send" type="submit" hidden></button>
      </form>
      <p id="composer-hint"></p>
    </footer>
  </section>
</main>
<dialog id="artifact-dialog">
  <header>
    <span id="artifact-kind"></span>
    <span id="artifact-title"></span>
    <a id="artifact-tab" target="_blank" rel="noreferrer"
       title="Open in a real tab">&#8599;</a>
    <button type="button" id="artifact-close" aria-label="Close" autofocus>&#215;</button>
  </header>
  <iframe id="artifact-frame" sandbox="allow-same-origin" title="Artifact"></iframe>
</dialog>

<dialog id="new-dialog">
  <form id="new-form" method="dialog">
    <h2>New specialist</h2>

    <label for="f-project">Project</label>
    <input id="f-project" list="project-list" autocomplete="off"
           placeholder="Start typing a repo name" required />
    <datalist id="project-list"></datalist>

    <label for="f-label">Label</label>
    <input id="f-label" autocomplete="off" placeholder="password-reset" required />
    <p class="field-note">Lowercase letters, numbers and hyphens. Names the branch and worktree.</p>

    <label for="f-model">Model</label>
    <select id="f-model">
      <option value="opus">Opus</option>
      <option value="sonnet">Sonnet</option>
    </select>

    <div class="check">
      <input type="checkbox" id="f-worktree" checked />
      <label for="f-worktree">Start in a worktree</label>
    </div>
    <p class="field-note" id="f-worktree-note"></p>

    <p id="f-error" class="error" hidden></p>

    <div class="actions">
      <button type="button" id="f-cancel">Cancel</button>
      <button type="submit" id="f-create">Create</button>
    </div>
  </form>
</dialog>

<link rel="stylesheet" href="/styles.css" />
<script type="module" src="/app.js"></script>
